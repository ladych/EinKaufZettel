name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analysis, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Formatting and static analysis
        run: ./gradlew spotlessCheck detekt

      - name: Unit tests and coverage
        run: ./gradlew test koverLog koverVerify --continue

      - name: Diagnose coverage (temporary)
        if: always()
        run: |
          ./gradlew :core:parsing:test --rerun --info | grep -E -i "javaagent|Starting process 'Gradle Test Executor" | cut -c1-2000 || true
          ./gradlew :core:parsing:koverXmlReport || true
          head -c 3000 core/parsing/build/reports/kover/report.xml || true
          echo; ls -la core/parsing/build/kover/bin-reports/ core/parsing/build/libs/ || true
          ./gradlew :core:parsing:dependencies --configuration testRuntimeClasspath | grep -E -i "kotest|junit|jacoco|byte" | head -30 || true
          java -version

      - name: Android Lint
        run: ./gradlew lint

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Print coverage agent errors
        if: failure()
        run: find . -path '*/build/*' -name 'coverage-error.log' -print -exec cat {} \; || true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
