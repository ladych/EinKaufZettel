name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analysis, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Formatting and static analysis
        run: ./gradlew spotlessCheck detekt

      - name: Unit tests and coverage
        run: ./gradlew test koverLog koverVerify --continue

      - name: Diagnose coverage (temporary)
        if: always()
        run: |
          ./gradlew :core:parsing:test --rerun --info | grep -E -i "javaagent|Starting process 'Gradle Test Executor" | cut -c1-2000 || true
          ./gradlew :core:parsing:koverXmlReport || true
          head -c 300 core/parsing/build/reports/kover/report.xml || true; echo
          curl -sSL -o /tmp/jacococli.jar https://repo1.maven.org/maven2/org/jacoco/org.jacoco.cli/0.8.14/org.jacoco.cli-0.8.14-nodeps.jar
          echo "== exec summary"; java -jar /tmp/jacococli.jar execinfo core/parsing/build/kover/bin-reports/test.exec > /tmp/execinfo.txt 2>&1 || true
          head -15 /tmp/execinfo.txt; wc -l /tmp/execinfo.txt; grep -c "kotlin/" /tmp/execinfo.txt || true; grep ladych /tmp/execinfo.txt || true
          awk '{print $NF}' /tmp/execinfo.txt | cut -d/ -f1-3 | sort | uniq -c | sort -rn | head -20
          echo "== class ids in classes dir"; java -jar /tmp/jacococli.jar classinfo core/parsing/build/classes/kotlin/main | head -20 || true
          echo "== class ids in jar"; java -jar /tmp/jacococli.jar classinfo core/parsing/build/libs/parsing.jar | head -20 || true

      - name: Android Lint
        run: ./gradlew lint

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Print coverage agent errors
        if: failure()
        run: find . -path '*/build/*' -name 'coverage-error.log' -print -exec cat {} \; || true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
